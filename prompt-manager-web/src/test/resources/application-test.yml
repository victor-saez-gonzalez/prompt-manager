spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true

  jackson:
    serialization:
      fail-on-empty-beans: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org.springframework.web: DEBUG
